<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiEase | Society Auth</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- External App Login Script -->
    <script src="/login.js"></script>
</head>
<body class="bg-gradient-to-br from-corporate-900 via-corporate-800 to-brand-600 min-h-screen w-full flex items-center justify-center p-4 py-8 overflow-y-auto">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-2xl shadow-2xl text-white">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-brand-500 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-lg shadow-brand-500/50">
                <i class="fa-solid fa-building"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white" id="auth-title">ResiEase</h2>
            <p class="text-xs text-gray-300 mt-1" id="auth-subtitle">Please sign in to access your dashboard</p>
        </div>
        


        <!-- Mode Toggle inside Sign In (Password vs OTP) -->
        <div class="flex space-x-1 bg-white/5 p-1 rounded-xl mb-6" id="login-tabs">
            <button type="button" onclick="setAuthMethod('password')" id="tab-password" class="w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg bg-white/10 text-white focus:outline-none transition-all">Password Login</button>
            <button type="button" onclick="setAuthMethod('otp')" id="tab-otp" class="w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all">Resident OTP</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-email" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </span>
                    <input id="login-email" type="email" required class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="treasurer@society.com">
                </div>
            </div>
            
            <div id="login-password-group">
                <label for="login-password" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input id="login-password" type="password" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="••••••••">
                </div>
            </div>

            <div id="login-otp-group" class="hidden">
                <label for="login-otp-code" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">6-Digit Verification PIN</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-key text-xs"></i>
                    </span>
                    <input id="login-otp-code" type="text" maxlength="6" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="123456">
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="w-full bg-brand-500 text-white hover:bg-brand-600 font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-brand-500/30 transition-all hover:scale-[1.01] focus:outline-none text-sm mt-2">
                Sign In
            </button>
        </form>

        <div id="google-auth-section">
            <div class="relative flex items-center py-2 mt-4">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink-0 mx-4 text-gray-500 text-xs">OR</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <div id="google-btn-container" class="w-full flex justify-center mt-4 min-h-[44px]">
                <!-- Button will be rendered here by JS -->
                <div id="google-auth-fallback" class="text-xs text-gray-400 flex items-center justify-center">Loading Google Sign-in...</div>
            </div>
        </div>


    </div>

    <!-- External Interactive script for login flows -->
    <script src="/login.js"></script>
</body>
</html>
