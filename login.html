<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiEase | Society Auth</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        corporate: {
                            900: '#0B0F19',
                            800: '#151C2C',
                            700: '#1F2937',
                            600: '#374151',
                            100: '#F4F5F7',
                        },
                        brand: {
                            500: '#4F46E5',
                            600: '#4338CA'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-corporate-900 via-corporate-800 to-brand-600 min-h-screen w-full flex items-center justify-center p-4 py-8 overflow-y-auto">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-2xl shadow-2xl text-white">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-brand-500 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-lg shadow-brand-500/50">
                <i class="fa-solid fa-building"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white" id="auth-title">ResiEase</h2>
            <p class="text-xs text-gray-300 mt-1" id="auth-subtitle">Please sign in to access your dashboard</p>
        </div>
        


        <!-- Mode Toggle inside Sign In (Password vs OTP) -->
        <div class="flex space-x-1 bg-white/5 p-1 rounded-xl mb-6" id="login-tabs">
            <button type="button" onclick="setAuthMethod('password')" id="tab-password" class="w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg bg-white/10 text-white focus:outline-none transition-all">Password Login</button>
            <button type="button" onclick="setAuthMethod('otp')" id="tab-otp" class="w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all">Resident OTP</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-email" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </span>
                    <input id="login-email" type="email" required class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="treasurer@society.com">
                </div>
            </div>
            
            <div id="login-password-group">
                <label for="login-password" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input id="login-password" type="password" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="••••••••">
                </div>
            </div>

            <div id="login-otp-group" class="hidden">
                <label for="login-otp-code" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">6-Digit Verification PIN</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-key text-xs"></i>
                    </span>
                    <input id="login-otp-code" type="text" maxlength="6" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="123456">
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="w-full bg-brand-500 text-white hover:bg-brand-600 font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-brand-500/30 transition-all hover:scale-[1.01] focus:outline-none text-sm mt-2">
                Sign In
            </button>
        </form>

        <div id="google-auth-section">
            <div class="relative flex items-center py-2 mt-4">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink-0 mx-4 text-gray-500 text-xs">OR</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <div id="google-btn-container" class="w-full flex justify-center mt-4 min-h-[44px]">
                <!-- Button will be rendered here by JS -->
                <div id="google-auth-fallback" class="text-xs text-gray-400 flex items-center justify-center">Loading Google Sign-in...</div>
            </div>
        </div>


    </div>

    <script>
        let authMethod = 'password';
        let otpSent = false;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 p-4 rounded-xl border shadow-xl text-white bg-corporate-900 border-white/20 transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto max-w-sm`;
            
            let icon = 'fa-circle-check text-emerald-400';
            if (type === 'error') icon = 'fa-circle-xmark text-red-400';
            if (type === 'info') icon = 'fa-circle-info text-blue-400';

            toast.innerHTML = `
                <i class="fa-solid ${icon} text-lg"></i>
                <div class="text-sm font-semibold">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }



        function setAuthMethod(method) {
            authMethod = method;
            const pGroup = document.getElementById('login-password-group');
            const otpGroup = document.getElementById('login-otp-group');
            const tabPassword = document.getElementById('tab-password');
            const tabOtp = document.getElementById('tab-otp');
            const submitBtn = document.getElementById('login-submit-btn');

            if (method === 'password') {
                pGroup.classList.remove('hidden');
                otpGroup.classList.add('hidden');
                document.getElementById('login-password').required = true;
                document.getElementById('login-otp-code').required = false;
                
                tabPassword.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg bg-white/10 text-white focus:outline-none transition-all';
                tabOtp.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all';
                submitBtn.innerText = 'Sign In';
                otpSent = false;
            } else {
                pGroup.classList.add('hidden');
                otpGroup.classList.add('hidden');
                document.getElementById('login-password').required = false;
                document.getElementById('login-otp-code').required = false;

                tabPassword.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all';
                tabOtp.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg bg-white/10 text-white focus:outline-none transition-all';
                submitBtn.innerText = 'Send OTP PIN';
            }
        }

        // Initialize Google Sign-in via JS for better reliability
        window.onload = function () {
            const container = document.getElementById('google-btn-container');
            const fallbackElement = document.getElementById('google-auth-fallback');

            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                try {
                    google.accounts.id.initialize({
                        client_id: '1033704835291-2t1v5b1junmn6imkbssvn0ku51v4tpur.apps.googleusercontent.com',
                        callback: handleGoogleCredentialResponse,
                        use_fedcm_for_prompt: true
                    });
                    
                    if(fallbackElement) fallbackElement.remove();

                    google.accounts.id.renderButton(
                        container,
                        { theme: 'outline', size: 'large', type: 'standard', shape: 'rectangular', text: 'signin_with', logo_alignment: 'left' }
                    );
                } catch(err) {
                    console.error("Google Auth Init Error:", err);
                }
            }

            // Diagnostic Check: If the button (iframe) doesn't appear after 2.5 seconds, Google blocked it.
            setTimeout(() => {
                if (!container.querySelector('iframe')) {
                    container.innerHTML = `
                        <div class="w-full bg-red-900/40 border border-red-500/50 text-red-200 p-4 rounded-xl text-xs text-center shadow-lg">
                            <i class="fa-solid fa-triangle-exclamation text-red-400 text-lg mb-2"></i><br>
                            <strong class="text-sm">Google Sign-in Blocked</strong><br><br>
                            Google is hiding the button because this URL is unauthorized.<br><br>
                            Go to <b>Google Cloud Console &rarr; Credentials &rarr; OAuth Client ID</b> and add:<br>
                            <code class="block bg-black/50 p-2 mt-2 mb-2 rounded text-brand-300 font-mono text-[10px]">https://society-management-app-xh6q.onrender.com</code>
                            to your <b>Authorized JavaScript origins</b>.
                        </div>
                    `;
                }
            }, 2500);
        };

        async function handleGoogleCredentialResponse(response) {
            try {
                showToast('Verifying Google Login...', 'info');
                
                const res = await fetch('/api/login/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });
                
                const data = await res.json();
                if (res.ok) {
                    showToast('Google Sign-In successful!', 'success');
                    setTimeout(() => {
                        window.location.href = data.user.role === 'master_admin' ? '/master.html' : '/app';
                    }, 800);
                } else {
                    showToast(data.error || 'Authentication failed', 'error');
                }
            } catch (err) {
                showToast('Network error during Google login', 'error');
            }
        }


        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;

            if (authMethod === 'password') {
                const password = document.getElementById('login-password').value;
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    // Save session details to localstorage for dynamic navigation checks
                    localStorage.setItem('user_role', data.user.role);
                    localStorage.setItem('user_email', email);

                    showToast('Authenticated successfully. Loading app...');
                    setTimeout(() => window.location.href = '/app', 600);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            } else {
                // OTP Access Mode
                if (!otpSent) {
                    try {
                        const res = await fetch('/api/auth/send-otp', {
                            method: 'POST',
                            headers: { 'content-type': 'application/json' },
                            body: JSON.stringify({ email })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error);
                        
                        otpSent = true;
                        document.getElementById('login-otp-group').classList.remove('hidden');
                        document.getElementById('login-otp-code').required = true;
                        document.getElementById('login-submit-btn').innerText = 'Verify & Sign In';
                        showToast('Verification PIN sent. Check your email or the server console.', 'info');
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                } else {
                    const code = document.getElementById('login-otp-code').value;
                    try {
                        const res = await fetch('/api/auth/verify-otp', {
                            method: 'POST',
                            headers: { 'content-type': 'application/json' },
                            body: JSON.stringify({ email, code, otp: code })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error);

                        localStorage.setItem('user_role', data.user.role);
                        localStorage.setItem('user_email', email);

                        showToast('Authenticated successfully. Loading app...');
                        setTimeout(() => window.location.href = '/app', 600);
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const societyName = document.getElementById('reg-society-name').value;
            const registrationNo = document.getElementById('reg-regno').value;

            // Validate Registration Number as per Indian Housing Society Laws
            const parts = registrationNo.split('/');
            if (parts.length < 5 || parts.length > 6) {
                showToast('Invalid registration number layout. Must be DISTRICT/WARD/HSG/[TC|TA|GN]/NUMBER/YEAR (e.g. MUM/WP/HSG/TC/12345/2026)', 'error');
                return;
            }
            const [dist, ward, cls, sub] = parts.length === 6 ? parts : [parts[0], parts[1], parts[2], 'GN'];
            const validDists = new Set(['MUM', 'PNE', 'TNA', 'NGP', 'KGD', 'NAS', 'AMD', 'SAT', 'SOL', 'KOP', 'LAT', 'AUR', 'NND', 'JAL', 'DHU', 'NSA', 'KBD', 'YAT', 'CHA', 'BND', 'GND', 'GAD', 'AMR', 'BUL', 'WAS', 'AKO', 'PAR', 'BEED', 'OSM', 'JLG', 'RAT', 'SNG', 'SIN']);
            if (!validDists.has(dist.toUpperCase())) {
                showToast(`Invalid District code "${dist}". Must be a valid Maharashtra district (e.g. MUM, PNE, TNA)`, 'error');
                return;
            }
            if (cls.toUpperCase() !== 'HSG') {
                showToast(`Invalid Classification "${cls}". Housing societies must have classification code "HSG"`, 'error');
                return;
            }
            const validSubs = new Set(['TC', 'TA', 'GN', 'OD', 'MHS']);
            if (!validSubs.has(sub.toUpperCase())) {
                showToast(`Invalid Sub-classification "${sub}". Must be one of: TC, TA, GN, OD`, 'error');
                return;
            }
            const num = parts.length === 6 ? parts[4] : parts[3];
            const yr = parts.length === 6 ? parts[5] : parts[4];
            if (!/^\d+$/.test(num)) {
                showToast(`Invalid Serial Number "${num}". Must be numeric`, 'error');
                return;
            }
            if (!/^\d{4}$/.test(yr)) {
                showToast(`Invalid Registration Year "${yr}". Must be a 4-digit year`, 'error');
                return;
            }
            const yearVal = parseInt(yr);
            const currentYear = new Date().getFullYear();
            if (yearVal < 1960 || yearVal > currentYear) {
                showToast(`Invalid Year ${yearVal}. Must be between 1960 and ${currentYear}`, 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/register-society', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ name, email, password, societyName, registrationNo })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('user_role', 'super_admin');
                localStorage.setItem('user_email', email);

                showToast('Society registered & space deployed successfully!');
                setTimeout(() => window.location.href = '/app', 1000);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // Toggle mode based on URL query parameter
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('mode') === 'register') {
                setMode('register');
            }
        });
    </script>
</body>
</html>
