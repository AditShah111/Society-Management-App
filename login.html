<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResiEase - Sign In</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        corporate: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                            100: '#f8fafc',
                        },
                        brand: {
                            500: '#2563eb',
                            600: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-corporate-900 via-corporate-800 to-brand-600 h-screen w-screen flex items-center justify-center p-4">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-2xl shadow-2xl text-white">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-brand-500 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-lg shadow-brand-500/50">
                <i class="fa-solid fa-building"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white" id="auth-title">ResiEase</h2>
            <p class="text-xs text-gray-300 mt-1" id="auth-subtitle">Please sign in to access your dashboard</p>
        </div>
        
        <!-- Tab Navigation (Switch login vs register) -->
        <div class="flex space-x-1 bg-white/5 p-1 rounded-xl mb-6" id="auth-tabs">
            <button type="button" onclick="setMode('login')" id="tab-login" class="w-1/2 py-2 text-xs font-bold text-center rounded-lg bg-brand-500 text-white focus:outline-none transition-all">Sign In</button>
            <button type="button" onclick="setMode('register')" id="tab-register" class="w-1/2 py-2 text-xs font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all">Register Society</button>
        </div>

        <!-- Mode Toggle inside Sign In (Password vs OTP) -->
        <div class="flex space-x-1 bg-white/5 p-1 rounded-xl mb-6" id="login-tabs">
            <button type="button" onclick="setAuthMethod('password')" id="tab-password" class="w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg bg-white/10 text-white focus:outline-none transition-all">Password Login</button>
            <button type="button" onclick="setAuthMethod('otp')" id="tab-otp" class="w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all">Resident OTP</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-email" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </span>
                    <input id="login-email" type="email" required class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="treasurer@society.com">
                </div>
            </div>
            
            <div id="login-password-group">
                <label for="login-password" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input id="login-password" type="password" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="••••••••">
                </div>
            </div>

            <div id="login-otp-group" class="hidden">
                <label for="login-otp-code" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">6-Digit Verification PIN</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-key text-xs"></i>
                    </span>
                    <input id="login-otp-code" type="text" maxlength="6" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="123456">
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="w-full bg-brand-500 text-white hover:bg-brand-600 font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-brand-500/30 transition-all hover:scale-[1.01] focus:outline-none text-sm mt-2">
                Sign In
            </button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="register-form" class="space-y-4 hidden">
            <div>
                <label for="reg-name" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Full Name (Super Admin)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input id="reg-name" type="text" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="e.g. Secretary Shah">
                </div>
            </div>

            <div>
                <label for="reg-email" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Admin Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </span>
                    <input id="reg-email" type="email" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="admin@society.com">
                </div>
            </div>

            <div>
                <label for="reg-password" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input id="reg-password" type="password" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="Minimum 6 characters">
                </div>
            </div>

            <div>
                <label for="reg-society-name" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Society Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-building text-xs"></i>
                    </span>
                    <input id="reg-society-name" type="text" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="e.g. Lotus CHS Ltd.">
                </div>
            </div>

            <div>
                <label for="reg-regno" class="block text-[10px] font-bold uppercase tracking-wider text-gray-300 mb-1.5">Registration Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-file-signature text-xs"></i>
                    </span>
                    <input id="reg-regno" type="text" class="w-full bg-white/5 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all outline-none" placeholder="MUM/WP/HSG/TC/12345/2026">
                </div>
            </div>

            <button type="submit" class="w-full bg-brand-500 text-white hover:bg-brand-600 font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-brand-500/30 transition-all hover:scale-[1.01] focus:outline-none text-sm mt-2">
                Register & Sign In
            </button>
        </form>
    </div>

    <script>
        let currentMode = 'login';
        let authMethod = 'password';
        let otpSent = false;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 p-4 rounded-xl border shadow-xl text-white bg-corporate-900 border-white/20 transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto max-w-sm`;
            
            let icon = 'fa-circle-check text-emerald-400';
            if (type === 'error') icon = 'fa-circle-xmark text-red-400';
            if (type === 'info') icon = 'fa-circle-info text-blue-400';

            toast.innerHTML = `
                <i class="fa-solid ${icon} text-lg"></i>
                <div class="text-sm font-semibold">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function setMode(mode) {
            currentMode = mode;
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const loginTabs = document.getElementById('login-tabs');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabs.classList.remove('hidden');
                
                tabLogin.className = 'w-1/2 py-2 text-xs font-bold text-center rounded-lg bg-brand-500 text-white focus:outline-none transition-all';
                tabRegister.className = 'w-1/2 py-2 text-xs font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all';
                
                document.getElementById('auth-title').innerText = 'ResiEase';
                document.getElementById('auth-subtitle').innerText = 'Please sign in to access your dashboard';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                loginTabs.classList.add('hidden');

                tabLogin.className = 'w-1/2 py-2 text-xs font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all';
                tabRegister.className = 'w-1/2 py-2 text-xs font-bold text-center rounded-lg bg-brand-500 text-white focus:outline-none transition-all';
                
                document.getElementById('auth-title').innerText = 'Register Society';
                document.getElementById('auth-subtitle').innerText = 'Deploy your dedicated housing compliance space';

                // Set register inputs required
                document.getElementById('reg-name').required = true;
                document.getElementById('reg-email').required = true;
                document.getElementById('reg-password').required = true;
                document.getElementById('reg-society-name').required = true;
                document.getElementById('reg-regno').required = true;
            }
        }

        function setAuthMethod(method) {
            authMethod = method;
            const pGroup = document.getElementById('login-password-group');
            const otpGroup = document.getElementById('login-otp-group');
            const tabPassword = document.getElementById('tab-password');
            const tabOtp = document.getElementById('tab-otp');
            const submitBtn = document.getElementById('login-submit-btn');

            if (method === 'password') {
                pGroup.classList.remove('hidden');
                otpGroup.classList.add('hidden');
                document.getElementById('login-password').required = true;
                document.getElementById('login-otp-code').required = false;
                
                tabPassword.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg bg-white/10 text-white focus:outline-none transition-all';
                tabOtp.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all';
                submitBtn.innerText = 'Sign In';
                otpSent = false;
            } else {
                pGroup.classList.add('hidden');
                otpGroup.classList.add('hidden');
                document.getElementById('login-password').required = false;
                document.getElementById('login-otp-code').required = false;

                tabPassword.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg text-gray-400 hover:text-white focus:outline-none transition-all';
                tabOtp.className = 'w-1/2 py-1.5 text-[11px] font-bold text-center rounded-lg bg-white/10 text-white focus:outline-none transition-all';
                submitBtn.innerText = 'Send OTP PIN';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;

            if (authMethod === 'password') {
                const password = document.getElementById('login-password').value;
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    // Save session details to localstorage for dynamic navigation checks
                    localStorage.setItem('user_role', data.user.role);
                    localStorage.setItem('user_email', email);

                    showToast('Authenticated successfully. Loading app...');
                    setTimeout(() => window.location.href = '/app', 600);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            } else {
                // OTP Access Mode
                if (!otpSent) {
                    try {
                        const res = await fetch('/api/auth/send-otp', {
                            method: 'POST',
                            headers: { 'content-type': 'application/json' },
                            body: JSON.stringify({ email })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error);
                        
                        otpSent = true;
                        document.getElementById('login-otp-group').classList.remove('hidden');
                        document.getElementById('login-otp-code').required = true;
                        document.getElementById('login-submit-btn').innerText = 'Verify & Sign In';
                        showToast('Verification PIN sent. Check your email or the server console.', 'info');
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                } else {
                    const code = document.getElementById('login-otp-code').value;
                    try {
                        const res = await fetch('/api/auth/verify-otp', {
                            method: 'POST',
                            headers: { 'content-type': 'application/json' },
                            body: JSON.stringify({ email, code })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error);

                        localStorage.setItem('user_role', data.user.role);
                        localStorage.setItem('user_email', email);

                        showToast('Authenticated successfully. Loading app...');
                        setTimeout(() => window.location.href = '/app', 600);
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const societyName = document.getElementById('reg-society-name').value;
            const registrationNo = document.getElementById('reg-regno').value;

            try {
                const res = await fetch('/api/auth/register-society', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ name, email, password, societyName, registrationNo })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                localStorage.setItem('user_role', 'super_admin');
                localStorage.setItem('user_email', email);

                showToast('Society registered & space deployed successfully!');
                setTimeout(() => window.location.href = '/app', 1000);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
